<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>✦ S*A Hotel · Premium Management</title>
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="logo">✦ S*A</div>
  <div class="sub">Powered by S*A for Mubarak Taiba</div>
</div>

<!-- MAIN APP CONTAINER -->
<div class="app-container" id="appContainer">
  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <div class="login-card">
      <h2>welcome back</h2>
      <div class="subtitle">sign in to manage</div>
      <label>Username</label>
      <input type="text" id="loginUser" value="Noman@1985">
      <label>Password</label>
      <input type="password" id="loginPass" value="786092">
      <div id="loginError" class="error-msg"></div>
      <button class="btn-glow" id="loginBtn"><i class="fas fa-key"></i> &nbsp;Login</button>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboardPage">
    <div class="dashboard-header">
      <h1><i class="fas fa-hotel"></i> S*A · Management</h1>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="number" id="statTotal">24</div><div class="label">Total Rooms</div></div>
      <div class="stat-card"><div class="number" id="statAvailable">24</div><div class="label">Available</div></div>
      <div class="stat-card"><div class="number" id="statReserved">0</div><div class="label">Reserved</div></div>
      <div class="stat-card"><div class="number" id="statCheckin">0</div><div class="label">Today's Check-in <button class="info-btn" id="checkinInfoBtn" type="button" title="View check-in list">ℹ️</button></div></div>
      <div class="stat-card"><div class="number" id="statCheckout">0</div><div class="label">Today's Check-out <button class="info-btn" id="checkoutInfoBtn" type="button" title="View check-out list">ℹ️</button></div></div>
      <div class="stat-card"><div class="number" id="statBooked">0</div><div class="label">Booked Rooms</div></div>
      <div class="stat-card"><div class="number" id="statCurrAvail">0</div><div class="label">Current Available</div></div>
      <div class="stat-card"><div class="number" id="statIncome">$0</div><div class="label">Total Income</div></div>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Search by guest, mobile, room...">
    </div>

    <!-- ROOMS GRID -->
    <div class="rooms-grid" id="roomsGrid"></div>

    <!-- BOTTOM IMAGE: NOMAN.jpg (from file folder) -->
    <div class="footer-image">
      <img src="pic/NOMAN.jpg" alt="Noman" title="Noman">
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard">
        <h2><span id="modalTitle">Room 101</span> <button class="close-modal" id="closeModalBtn">&times;</button></h2>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
